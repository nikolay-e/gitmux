[package]
name = "gitmux"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Many coding agents, one git checkout: each commits only its own paths, verified by the repository's hooks, without stashing anyone's work"
repository = "https://github.com/nikolay-e/gitmux"
readme = "README.md"
keywords = ["git", "agents", "monorepo", "pre-commit", "claude"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "git-mux"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/git-mux-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "git-mux-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/git-mux-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "git-mux-x86_64-unknown-linux-musl/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/git-mux-aarch64-unknown-linux-musl.tar.gz"
bin-dir = "git-mux-aarch64-unknown-linux-musl/{ bin }{ binary-ext }"

[profile.release]
lto = true
codegen-units = 1
strip = true
